# Fly.io config for HikerHunger.
# The app is stateless (all user data lives in the browser's IndexedDB),
# so it can scale to zero and needs no volumes or secrets.
app = "hikerhunger"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
